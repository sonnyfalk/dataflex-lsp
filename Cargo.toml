[package]
name = "dataflex-lsp"
version = "0.8.8"
edition = "2024"

[dependencies]
dashmap = "6.2.1"
dirs = "6.0.0"
flexi_logger = { version = "0.31.10", default-features = false }
line-span = "0.1.5"
log = "0.4.33"
log-panics = { version = "2.1.0", features = ["with-backtrace"] }
multimap = "0.10.1"
rayon = "1.12.0"
rmp-serde = "1.3.1"
rust-ini = "0.21.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
streaming-iterator = "0.1.9"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-lsp = "0.20.0"
tree-sitter = "0.26.12"
tree-sitter-dataflex = { version = "0.1.0", path = "../tree-sitter-dataflex" }
which = "8.0.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
